# Fork-only manual build, copied from nightly.yml at 393aa427407b2983af5c131575f57e11267e29dd.
# Keep upstream workflows unchanged to make syncing the fork straightforward.
# Run from Actions > Build Windows Artifact > Run workflow, then download the
# artifact from the completed run. No repository secrets are required.

name: Build Windows Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\..\vcpkg
      VCPKG_BUILD_TYPE: release
      CUDA_PATH: "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v12.8"
      BUILD_DIR: b

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install CUDA 12.8
        run: |
          cd ..
          Invoke-WebRequest https://developer.download.nvidia.com/compute/cuda/12.8.0/local_installers/cuda_12.8.0_571.96_windows.exe -OutFile cuda.exe -Verbose
          Start-Process -FilePath .\cuda.exe -ArgumentList "-y -s -accepteula -toolkit -override -noDisplayDriver" -Wait

      - name: Set CUDA environment
        run: |
          echo "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CUDA_PATH_V12_8=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8\libnvvp" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Normalize vcpkg path
        run: '"VCPKG_ROOT=$([System.IO.Path]::GetFullPath($env:VCPKG_ROOT))" >> $env:GITHUB_ENV'

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          # The vcpkg checkout must contain every pinned port version, so the key moves
          # with the pins. No restore-keys: an older clone restored under a new key
          # would make the clone below fail on the existing directory.
          key: vcpkg-tool-${{ runner.os }}-2026-10-22

      - name: Setup vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        run: |
          cd ..
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vcpkg_installed
        uses: actions/cache@v6
        with:
          path: ${{ env.BUILD_DIR }}/vcpkg_installed
          key: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-installed-${{ runner.os }}-prebuilt-ort-v1-

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildDir = $env:BUILD_DIR
          $cmakeArgs = "-B $buildDir -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PORTABLE=ON -DBUILD_PYTHON_STUBS=OFF"
          $retryablePatterns = @(
            'status code 5\d\d',
            'timed out',
            'timeout',
            'connection reset',
            'failed to connect',
            'temporarily unavailable',
            'tls',
            'ssl'
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Configure attempt $attempt/3"
            cmd /c "call `"C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat`" && cmake $cmakeArgs"

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            $shouldRetry = $false
            $manifestLog = Join-Path $buildDir 'vcpkg-manifest-install.log'
            if (Test-Path $manifestLog) {
              foreach ($pattern in $retryablePatterns) {
                if (Select-String -Path $manifestLog -Pattern $pattern -Quiet) {
                  $shouldRetry = $true
                  break
                }
              }
            }

            if (-not $shouldRetry -or $attempt -eq 3) {
              exit $LASTEXITCODE
            }

            Write-Warning "Retryable configure failure detected, cleaning build tree before retry."
            if (Test-Path $buildDir) {
              Remove-Item -Recurse -Force $buildDir
            }
            Start-Sleep -Seconds (15 * $attempt)
          }

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build %BUILD_DIR% -j %NUMBER_OF_PROCESSORS%

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dateStamp = Get-Date -AsUTC -Format "yyyyMMdd"
          $builtAt = Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ"
          $shortSha = (git rev-parse --short HEAD).Trim()
          $fullSha = (git rev-parse HEAD).Trim()
          $targetVersionFile = ".github/nightly-target-version.txt"
          if (-not (Test-Path $targetVersionFile)) {
            throw "Missing $targetVersionFile."
          }
          $nightlyTargetVersion = Get-Content $targetVersionFile |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith("#") } |
            Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($nightlyTargetVersion) -or $nightlyTargetVersion -eq "SET_ME") {
            throw "Set the target version in $targetVersionFile, for example 0.6 or 0.5.4.1."
          }
          if ($nightlyTargetVersion -notmatch '^[0-9]+(\.[0-9]+){1,3}$') {
            throw "Invalid nightly target version '$nightlyTargetVersion' in $targetVersionFile."
          }
          $packageVersion = "$nightlyTargetVersion.dev$dateStamp+$shortSha"
          $packageName = "LichtFeld-Studio-windows-v$packageVersion.zip"
          cmake --install $env:BUILD_DIR --prefix dist
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the portable package."
          }
          Compress-Archive -Path dist\* -DestinationPath $packageName
          $checksum = (Get-FileHash -Algorithm SHA256 -Path $packageName).Hash.ToLowerInvariant()
          Set-Content -Path "$packageName.sha256" -Value "$checksum  $packageName" -Encoding ascii
          "package_name=$packageName" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "full_sha=$fullSha" >> $env:GITHUB_OUTPUT
          "built_at=$builtAt" >> $env:GITHUB_OUTPUT

      - name: Upload Windows package
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: LichtFeld-Studio-windows-v${{ steps.package.outputs.package_version }}
          path: |
            ${{ steps.package.outputs.package_name }}
            ${{ steps.package.outputs.package_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Publish summary
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          FULL_SHA: ${{ steps.package.outputs.full_sha }}
          BUILT_AT: ${{ steps.package.outputs.built_at }}
        run: |
          $summary = @(
            '### Windows portable build'
            ''
            "- [Download $env:PACKAGE_NAME]($env:ARTIFACT_URL)"
            "- Commit: ``$env:FULL_SHA``"
            "- Built at: ``$env:BUILT_AT``"
            '- Includes the portable ZIP and its SHA-256 checksum.'
            '- Artifacts expire after 90 days; save a local copy.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Dump failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $buildDir = $env:BUILD_DIR
          $paths = @(
            "$buildDir\vcpkg-manifest-install.log",
            "$buildDir\vcpkg_installed\vcpkg\issue_body.md",
            "$buildDir\CMakeFiles\CMakeConfigureLog.yaml",
            "$buildDir\CMakeFiles\CMakeError.log",
            "$buildDir\CMakeFiles\CMakeOutput.log",
            "$buildDir\CMakeCache.txt"
          )

          foreach ($path in $paths) {
            if (Test-Path $path) {
              Write-Host "::group::$path"
              Get-Content $path -Tail 400
              Write-Host "::endgroup::"
            }
          }

      # Failure-only; small log payload with short retention stays well under the
      # GitHub Actions artifact quota.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifact-diagnostics-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.BUILD_DIR }}/vcpkg-manifest-install.log
            ${{ env.BUILD_DIR }}/vcpkg_installed/vcpkg/issue_body.md
            ${{ env.BUILD_DIR }}/vcpkg_installed/vcpkg/blds/**/*.log
